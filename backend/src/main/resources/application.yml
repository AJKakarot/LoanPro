spring:
  application:
    name: loan-processing
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/loanpro}
    username: ${DATABASE_USERNAME:loanpro}
    password: ${DATABASE_PASSWORD:loanpro}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:bG9hbnByby1kZXZlbG9wbWVudC1qd3Qtc2VjcmV0LTMyYg==}
    access-token-minutes: 15
    refresh-token-days: 7
    issuer: ${JWT_ISSUER:loanpro}
    audience: ${JWT_AUDIENCE:loanpro-api}
  security:
    lockout-attempts: ${LOCKOUT_ATTEMPTS:5}
    lockout-minutes: ${LOCKOUT_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8081,http://127.0.0.1:5173}
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:${user.dir}/data/uploads}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      bucket: ${S3_BUCKET:loanpro-docs}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      path-style: true
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      folder: ${CLOUDINARY_FOLDER:loanpro}
  mail:
    from: ${MAIL_FROM:noreply@loanpro.local}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  ai:
    service-url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:90}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} traceId=%X{traceId} - %msg%n"
  level:
    com.loanpro: INFO
    org.springframework.security: WARN
