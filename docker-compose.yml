services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loanpro
      POSTGRES_USER: loanpro
      POSTGRES_PASSWORD: loanpro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanpro -d loanpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/loanpro}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-loanpro}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-loanpro}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      STORAGE_TYPE: ${STORAGE_TYPE:-cloudinary}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-loanpro}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8081,http://localhost:80
      JWT_SECRET: bG9hbnByby1kZXZlbG9wbWVudC1qd3Qtc2VjcmV0LTMyYg==
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
    ports:
      - "8080:8080"
    depends_on:
      mailhog:
        condition: service_started

  ai-service:
    profiles: ["app"]
    build:
      context: ./ai-service
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    ports:
      - "8000:8000"

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
